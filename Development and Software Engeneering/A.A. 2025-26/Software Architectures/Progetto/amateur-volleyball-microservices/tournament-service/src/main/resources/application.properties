spring.application.name=tournament-service
server.port=8082

spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Database - connecting to 'tournament_db'
spring.datasource.url=jdbc:postgresql://localhost:5432/tournament_db
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Date Format for JSON
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.serialization.write-dates-as-timestamps=false

# Manual service discovery
app.services.teams-url=http://localhost:8081
