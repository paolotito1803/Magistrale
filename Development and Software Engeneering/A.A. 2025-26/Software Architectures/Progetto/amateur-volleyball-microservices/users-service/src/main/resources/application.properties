spring.application.name=users-service
server.port=8083

spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Database - connecting to 'users_db'
spring.datasource.url=jdbc:postgresql://localhost:5432/users_db
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- CUSTOM CONFIG ---
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.admin.username=${ADMIN_USERNAME:Super}
app.admin.surname=${ADMIN_SURNAME:Admin}
app.admin.role=${ADMIN_ROLE:ADMIN}
app.admin.isactive=${ADMIN_ISACTIVE:true}
app.dev.default-password=${USER_PASSWORD}