spring.application.name=api-gateway
server.port=8080

spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# --- LOCAL ROUTES (IntelliJ) ---

# Teams Service (Local Port 8081)
spring.cloud.gateway.routes[0].id=teams-service
spring.cloud.gateway.routes[0].filters[0]=AuthFilter
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/teams/**

# Tournament Service (Local Port 8082)
spring.cloud.gateway.routes[1].id=tournament-service
spring.cloud.gateway.routes[1].filters[0]=AuthFilter
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/tournaments/**

# Users Service (Local Port 8083)
spring.cloud.gateway.routes[2].id=users-service
spring.cloud.gateway.routes[2].filters[0]=AuthFilter
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/users/**

# Ticketing Service (Local Port 8084)
spring.cloud.gateway.routes[3].id=ticketing-service
spring.cloud.gateway.routes[3].filters[0]=AuthFilter
spring.cloud.gateway.routes[3].uri=http://localhost:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/tickets/**

# JWT Secret
app.jwt.secret=${JWT_SECRET}

#User service discovery
users.service.url=http://localhost:8083