# Docker routes (all 8080 as docker makes an ip for each, as opposed to intellij env)
server.port=8080

# 1. TEAMS
spring.cloud.gateway.routes[0].id=teams-service
spring.cloud.gateway.routes[0].uri=http://teams-service:8080
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/teams/**

# 2. TOURNAMENT
spring.cloud.gateway.routes[1].id=tournament-service
spring.cloud.gateway.routes[1].uri=http://tournament-service:8080
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/tournaments/**

# 3. USERS
spring.cloud.gateway.routes[2].id=users-service
spring.cloud.gateway.routes[2].uri=http://users-service:8080
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/users/**

# 4. TICKETING
spring.cloud.gateway.routes[3].id=ticketing-service
spring.cloud.gateway.routes[3].uri=http://ticketing-service:8080
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/tickets/**

#User service discovery
users.service.url=http://localhost:8080